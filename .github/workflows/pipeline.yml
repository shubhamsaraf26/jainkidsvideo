name: AI Jain Video Factory

on:
  # Auto trigger when any story file changes
  push:
    paths:
      - "stories/**"

  # Manual trigger button
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    # Detect changed story file (only in push event)
    - name: Detect changed story file
      id: detect
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'stories/' | head -n 1 | sed 's|stories/||')
          echo "STORY_FILE=$FILE" >> $GITHUB_ENV
        else
          # Manual run fallback
          echo "STORY_FILE=story1.txt" >> $GITHUB_ENV
        fi

    - name: Show selected story
      run: echo "📘 Building story -> $STORY_FILE"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Python libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate AI Video
      run: python generate_video.py
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        STORY_FILE: ${{ env.STORY_FILE }}
