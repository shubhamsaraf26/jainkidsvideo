name: Jain AI Video Pipeline

on:
  # Auto run when new story file is added
  push:
    paths:
      - "stories/*.txt"

  # Manual trigger
  workflow_dispatch:
    inputs:
      story_file:
        description: "Story file path (example: stories/story9.txt)"
        required: true
        default: "stories/story1.txt"

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 requests google-api-python-client google-auth

      - name: Decide Story File
        id: storypicker
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "STORY_FILE=${{ github.event.inputs.story_file }}" >> $GITHUB_ENV
          else
            echo "STORY_FILE=${{ github.event.head_commit.added[0] }}" >> $GITHUB_ENV
          fi

      - name: Generate AI Video
        run: python generate_video.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STORY_FILE: ${{ env.STORY_FILE }}
