name: AI Jain Video Factory

on:
  # Auto run when any story file changes
  push:
    paths:
      - "stories/**"

  # Manual run button
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    # ===== Detect latest story file =====
    - name: Detect latest story file
      run: |
        # Try to detect changed story in this push
        FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^stories/.*\.txt' | tail -n 1 | sed 's|stories/||')

        # If nothing detected (manual run or edge case), pick newest file from stories folder
        if [ -z "$FILE" ]; then
          FILE=$(ls -t stories/*.txt | head -n 1 | sed 's|stories/||')
        fi

        echo "STORY_FILE=$FILE" >> $GITHUB_ENV

    - name: Show selected story
      run: echo "📘 Building story -> $STORY_FILE"

    # ===== Setup Python =====
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ===== Install FFmpeg =====
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # ===== Install Python dependencies =====
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ===== Run video generator =====
    - name: Generate AI Video
      run: python generate_video.py
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        STORY_FILE: ${{ env.STORY_FILE }}