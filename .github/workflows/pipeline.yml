name: AI Jain Video Factory

on:
  # Auto trigger when any story file changes
  push:
    paths:
      - "stories/**"

  # Manual trigger button in GitHub Actions
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    # ===== Detect changed story file safely =====
    - name: Detect changed story file
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^stories/.*\.txt' | head -n 1 | sed 's|stories/||')
          
          # If detection fails, use default
          if [ -z "$FILE" ]; then
            FILE="story1.txt"
          fi

          echo "STORY_FILE=$FILE" >> $GITHUB_ENV
        else
          # Manual run default
          echo "STORY_FILE=story1.txt" >> $GITHUB_ENV
        fi

    - name: Show selected story
      run: echo "📘 Building -> $STORY_FILE"

    # ===== Setup Python =====
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ===== Install FFmpeg =====
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # ===== Install Python Libraries =====
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ===== Run Video Generator =====
    - name: Generate AI Video
      run: python generate_video.py
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        STORY_FILE: ${{ env.STORY_FILE }}
