name: Jain AI Video Pipeline

on:
  push:
    paths:
      - "stories/*.txt"

  workflow_dispatch:
    inputs:
      story_file:
        description: "Story file path (example: stories/story12.txt)"
        required: false

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 requests google-api-python-client google-auth

      # 🔥 THIS STEP FIXES YOUR ISSUE
      - name: Detect Story File
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "STORY_FILE=${{ github.event.inputs.story_file }}" >> $GITHUB_ENV
          else
            FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^stories/.*\.txt$' | head -n 1)
            echo "STORY_FILE=$FILE" >> $GITHUB_ENV
          fi

      - name: Debug
        run: echo "Using STORY_FILE=$STORY_FILE"

      - name: Generate AI Video
        run: python generate_video.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STORY_FILE: ${{ env.STORY_FILE }}